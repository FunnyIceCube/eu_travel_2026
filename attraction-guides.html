      background: #faf7f0;

      border-radius: 8px;

      font: inherit;
      font-size: 13px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .link-button {
      display: grid;
      place-items: center;
    }

    html.auth-pending body {

    }

      position: fixed;

      display: grid;
      place-items: center;
      padding: 20px;

      margin-top: 10px;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;

</head>

  <script>
    (() => {
      const authHash = "a79b11521bbb6ceccb694aa47bf84d9c0e1a4ca945c4ed48abb5f1a0b9d030e5";

      const gate = document.querySelector(".auth-gate");

      const error = document.querySelector("#authError");

      const sha256Fallback = (text) => {
        const rightRotate = (value, amount) => (value >>> amount) | (value << (32 - amount));
        const bytes = new TextEncoder().encode(text);
        const words = [];
        const hash = [1779033703, 3144134277, 1013904242, 2773480762, 1359893119, 2600822924, 528734635, 1541459225];
        const k = [1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
        for (let i = 0; i < bytes.length; i++) words[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
        words[bytes.length >> 2] |= 0x80 << (24 - (bytes.length % 4) * 8);
        words[(((bytes.length + 8) >> 6) << 4) + 15] = bytes.length * 8;
        for (let i = 0; i < words.length; i += 16) {
          const w = words.slice(i, i + 16);
          let [a, b, c, d, e, f, g, h] = hash;
          for (let j = 0; j < 64; j++) {
            if (j >= 16) {
              const s0 = rightRotate(w[j - 15], 7) ^ rightRotate(w[j - 15], 18) ^ (w[j - 15] >>> 3);
              const s1 = rightRotate(w[j - 2], 17) ^ rightRotate(w[j - 2], 19) ^ (w[j - 2] >>> 10);
              w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
            }
            const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
            const ch = (e & f) ^ (~e & g);
            const temp1 = (h + s1 + ch + k[j] + w[j]) | 0;
            const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const temp2 = (s0 + maj) | 0;
            h = g; g = f; f = e; e = (d + temp1) | 0; d = c; c = b; b = a; a = (temp1 + temp2) | 0;
          }
          [a, b, c, d, e, f, g, h].forEach((value, index) => { hash[index] = (hash[index] + value) | 0; });
        }
        return hash.map((value) => (value >>> 0).toString(16).padStart(8, "0")).join("");
      };

      const sha256 = async (text) => {
        if (window.crypto && crypto.subtle) {
          const bytes = new TextEncoder().encode(text);
          const digest = await crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
        }
        return sha256Fallback(text);
      };

      const unlock = () => {
        document.documentElement.classList.remove("auth-pending");
        gate.remove();
      };

      if (window.EU_TRAVEL_CONFIG && window.EU_TRAVEL_CONFIG.disablePagePassword) {
        unlock();
        return;
      }

      if (localStorage.getItem(storageKey) === authHash) {
        unlock();
        return;
      }

      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") form.requestSubmit();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const currentHash = await sha256(input.value);
          if (currentHash === authHash) {
            localStorage.setItem(storageKey, authHash);
            unlock();
            return;
          }
          error.textContent = "密码不正确";
          input.select();
        } catch (authError) {
          error.textContent = "密码校验失败，请刷新后重试";
        }
      });
    })();
  </script>

    const cities = ["全部", ...Array.from(new Set(spots.map(spot => spot.city)))];
    let activeCity = "全部";
    let activeIndex = 0;

    function filteredSpots() {
      return activeCity === "全部" ? spots : spots.filter(spot => spot.city === activeCity);
    }

    function renderFilters() {
      document.getElementById("filters").innerHTML = cities.map(city => `
        <button type="button" class="${city === activeCity ? "active" : ""}" data-city="${city}">${city}</button>
      `).join("");
      document.querySelectorAll("[data-city]").forEach(button => {
        button.addEventListener("click", () => {
          activeCity = button.dataset.city;
          activeIndex = 0;
          renderAll();
        });
      });
    }

    function renderList() {
      const list = filteredSpots();
      document.getElementById("spotList").innerHTML = list.map((spot, index) => `
        <button class="spot-button ${index === activeIndex ? "active" : ""}" type="button" data-index="${index}">
          <span class="city">${spot.city} · ${spot.day}</span>
          <span class="name">${spot.name}</span>
          <span class="time">建议停留：${spot.time}</span>
        </button>
      `).join("");
      document.querySelectorAll("[data-index]").forEach(button => {
        button.addEventListener("click", () => {
          activeIndex = Number(button.dataset.index);
          renderGuide();
        });
      });
    }

    function listItems(items) {
      return items.map(item => `<li>${item}</li>`).join("");
    }

    function primaryCnName(name) {
      return name.split(/[A-Za-zÀ-ÿ]/)[0].trim() || name;
    }

    function xhsSearchUrl(spot, category) {
      const keyword = `${spot.city} ${primaryCnName(spot.name)} ${category}`;
      return `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}&type=51`;
    }

    function xhsCategoryLinks(spot) {
      return [
        {
          label: "景色图",
          query: "景色 图文 攻略",
          note: "看整体环境、外观、日景/夜景和是否值得专门停留。"
        },
        {
          label: "拍照机位",
          query: "拍照 机位 出片",
          note: "找低角度、长焦、广场边缘、桥边和少人时段。"
        },
        {
          label: "美食周边",
          query: "美食 餐厅 小吃",
          note: "优先看步行 10-15 分钟范围内的咖啡、甜品、小吃和正餐。"
        },
        {
          label: "玩法避坑",
          query: "攻略 避坑 排队 路线",
          note: "核对排队、预约、路线顺序、交通和是否需要删减。"
        }
      ].map(item => ({
        ...item,
        url: xhsSearchUrl(spot, item.query)
      }));
    }

    function renderXhsCards(spot) {
      return xhsCategoryLinks(spot).map(item => `
        <a class="xhs-card" href="${item.url}" target="_blank" rel="noopener noreferrer">
          <b>${item.label}</b>
          <span>${item.note}</span>
        </a>
      `).join("");
    }

    async function loadWikiImage(spot, token) {
      const hero = document.querySelector(".hero");
      if (!hero || hero.dataset.token !== token) return;
      const title = wikiTitles[spot.name];
      if (!title) {
        hero.classList.add("image-failed");
        return;
      }

      if (imageCache.has(title)) {
        const cached = imageCache.get(title);
        if (cached) hero.style.backgroundImage = `url('${cached}')`;
        else hero.classList.add("image-failed");
        return;
      }

      try {
        const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
        if (!response.ok) throw new Error("image request failed");
        const data = await response.json();
        const image = data.originalimage && data.originalimage.source
          ? data.originalimage.source
          : data.thumbnail && data.thumbnail.source;
        if (!image) throw new Error("no image");
        imageCache.set(title, image);
        if (hero.dataset.token === token) {
          hero.style.backgroundImage = `url('${image}')`;
          hero.classList.remove("image-failed");
        }
      } catch (error) {
        imageCache.set(title, "");
        if (hero.dataset.token === token) hero.classList.add("image-failed");
      }
    }

    function renderGuide() {
      const list = filteredSpots();
      const spot = list[activeIndex] || list[0] || spots[0];
      activeIndex = Math.max(0, Math.min(activeIndex, list.length - 1));
      document.querySelectorAll(".spot-button").forEach((button, index) => {
        button.classList.toggle("active", index === activeIndex);
      });
      const token = `${Date.now()}-${activeIndex}`;
      const xhsTips = xhsTipsFor(spot);
      document.getElementById("guide").innerHTML = `
        <section class="hero image-failed" data-token="${token}">
          <div class="hero-content">
            <span class="kicker">${spot.city} · ${spot.day} · 建议 ${spot.time}</span>
            <h2>${spot.name}</h2>
            <p>${spot.intro}</p>
          </div>
        </section>
        <section class="content">
          <div class="quick">
            <div><b>最佳时间</b><span>${spot.best}</span></div>
            <div><b>停留时长</b><span>${spot.time}</span></div>
            <div><b>玩法定位</b><span>${spot.play[0]}</span></div>
            <div><b>当天位置</b><span>${spot.day} · ${spot.city}</span></div>
          </div>
          <div class="grid">
            <article class="section">
              <h3>怎么玩</h3>
              <ul>${listItems(spot.play)}</ul>
            </article>
            <article class="section">
              <h3>必看 / 必吃 / 必玩</h3>
              <ul>${listItems(spot.must)}</ul>
            </article>
            <article class="section">
              <h3>拍照点</h3>
              <ul>${listItems(spot.photo)}</ul>
            </article>
            <article class="section">
              <h3>避坑提醒</h3>
              <ul>${listItems(spot.tips)}</ul>
            </article>
            <article class="section wide">
              <h3>小红书高频补充</h3>
              <ul>${listItems(xhsTips)}</ul>
            </article>
            <article class="section wide">
              <h3>小红书分类入口</h3>
              <p class="source">按当前景点自动拆成景色、拍照、美食、玩法四类搜索；打开链接后优先看近一年、收藏/评论较多、图片清晰且路线描述具体的笔记。</p>
              <div class="xhs-grid">${renderXhsCards(spot)}</div>
            </article>
            <article class="section wide">
              <h3>资料参考</h3>
              <p class="source">内容结合官方旅游/景点页面、常见旅行者攻略和本行程节奏整理。小红书补充来自站内搜索结果标题、搜索建议和高频主题归纳，不复制笔记原文。参考：${spot.source}。图片优先使用 Wikipedia/Wikimedia 页面图源；小红书分类入口用于继续查看站内真实笔记图片和链接。</p>
            </article>
          </div>
        </section>
      `;
      document.getElementById("guide").scrollTo({ top: 0, behavior: "smooth" });
      loadWikiImage(spot, token);
    }

    function renderAll() {
      renderFilters();
      renderList();
      renderGuide();
    }

    document.getElementById("nextSpot").addEventListener("click", () => {
      const list = filteredSpots();
      activeIndex = (activeIndex + 1) % list.length;
      renderList();
      renderGuide();
    });

    renderAll();
  </script>

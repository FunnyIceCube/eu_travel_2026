  <script>
    (() => {
      const authHash = "a79b11521bbb6ceccb694aa47bf84d9c0e1a4ca945c4ed48abb5f1a0b9d030e5";
      const storageKey = "eu_travel_2026_auth";
      const gate = document.querySelector(".auth-gate");
      const form = document.querySelector("#authForm");
      const input = document.querySelector("#authPassword");
      const error = document.querySelector("#authError");

      const sha256Fallback = (text) => {
        const rightRotate = (value, amount) => (value >>> amount) | (value << (32 - amount));
        const bytes = new TextEncoder().encode(text);
        const words = [];
        const hash = [1779033703, 3144134277, 1013904242, 2773480762, 1359893119, 2600822924, 528734635, 1541459225];
        const k = [1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
        for (let i = 0; i < bytes.length; i++) words[i >> 2] |= bytes[i] << (24 - (i % 4) * 8);
        words[bytes.length >> 2] |= 0x80 << (24 - (bytes.length % 4) * 8);
        words[(((bytes.length + 8) >> 6) << 4) + 15] = bytes.length * 8;
        for (let i = 0; i < words.length; i += 16) {
          const w = words.slice(i, i + 16);
          let [a, b, c, d, e, f, g, h] = hash;
          for (let j = 0; j < 64; j++) {
            if (j >= 16) {
              const s0 = rightRotate(w[j - 15], 7) ^ rightRotate(w[j - 15], 18) ^ (w[j - 15] >>> 3);
              const s1 = rightRotate(w[j - 2], 17) ^ rightRotate(w[j - 2], 19) ^ (w[j - 2] >>> 10);
              w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
            }
            const s1 = rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25);
            const ch = (e & f) ^ (~e & g);
            const temp1 = (h + s1 + ch + k[j] + w[j]) | 0;
            const s0 = rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22);
            const maj = (a & b) ^ (a & c) ^ (b & c);
            const temp2 = (s0 + maj) | 0;
            h = g; g = f; f = e; e = (d + temp1) | 0; d = c; c = b; b = a; a = (temp1 + temp2) | 0;
          }
          [a, b, c, d, e, f, g, h].forEach((value, index) => { hash[index] = (hash[index] + value) | 0; });
        }
        return hash.map((value) => (value >>> 0).toString(16).padStart(8, "0")).join("");
      };

      const sha256 = async (text) => {
        if (window.crypto && crypto.subtle) {
          const bytes = new TextEncoder().encode(text);
          const digest = await crypto.subtle.digest("SHA-256", bytes);
          return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, "0")).join("");
        }
        return sha256Fallback(text);
      };

      const unlock = () => {
        document.documentElement.classList.remove("auth-pending");
        gate.remove();
      };

      if (window.EU_TRAVEL_CONFIG && window.EU_TRAVEL_CONFIG.disablePagePassword) {
        unlock();
        return;
      }

      if (localStorage.getItem(storageKey) === authHash) {
        unlock();
        return;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const currentHash = await sha256(input.value);
          if (currentHash === authHash) {
            localStorage.setItem(storageKey, authHash);
            unlock();
            return;
          }
          error.textContent = "密码不正确";
          input.select();
        } catch (authError) {
          error.textContent = "密码校验失败，请刷新后重试";
        }
      });
    })();
  </script>

    function makeIcon(number, isLong, isActive) {
      return L.divIcon({
        className: "",
        html: `<span class="pin ${isLong ? "long" : ""} ${isActive ? "active" : ""}">${number}</span>`,

    function renderMap(dayId) {
      allLayers.clearLayers();
      if (typeof routeLayer !== "undefined") routeLayer.clearLayers();
      markerRefs.clear();
      const selectedDays = dayId ? days.filter(day => day.id === dayId) : days;
      const bounds = [];

      selectedDays.forEach(day => {
        const latlngs = day.stops.map(stop => [stop[1], stop[2]]);

        day.stops.forEach((stop, index) => {
          const [name, lat, lng, note, isLong] = stop;
          const marker = L.marker([lat, lng], {
            icon: makeIcon(index + 1, Boolean(isLong), Boolean(dayId))
          }).bindPopup(`
            <div class="popup-title">${day.date} · ${index + 1}. ${name}</div>
            <div class="popup-meta">${note}</div>
          `);

          marker.addTo(allLayers);
          markerRefs.set(`${day.id}-${index}`, marker);
          bounds.push([lat, lng]);
        });

        for (let i = 0; i < latlngs.length - 1; i++) {
          const fromLong = Boolean(day.stops[i][4]);
          const toLong = Boolean(day.stops[i + 1][4]);
          if (fromLong || toLong) {
            L.polyline([latlngs[i], latlngs[i + 1]], {
              color: day.color,
              weight: dayId ? 4 : 2,
              opacity: dayId ? 0.72 : 0.38,
              dashArray: "8 10"
            }).addTo(allLayers);
          } else {
            L.polyline([latlngs[i], latlngs[i + 1]], {
              color: day.color,
              weight: dayId ? 5 : 3,
              opacity: dayId ? 0.92 : 0.58
            }).addTo(allLayers);
          }
        }
      });

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [42, 42], maxZoom: dayId ? 13 : 5 });

    function navUrl(from, to, mode) {

    function setRouteStatus(html) {

    function requireAmapAccess() {
      if (AMAP_PROXY_BASE || AMAP_WEB_SERVICE_KEY) return;
      throw new Error("请先在上方保存高德 Web 服务 Key。服务器部署版会自动使用服务端代理。");
    }

    function setupAmapKeyPanel() {
      const input = document.getElementById("amapKeyInput");
      const button = document.getElementById("saveAmapKey");
      if (!input || !button) return;
      if (AMAP_PROXY_BASE || serverConfig.amapWebServiceKey) {
        input.value = "服务器已配置";
        input.disabled = true;
        button.disabled = true;
        button.textContent = "已配置";
        return;
      }
      input.value = AMAP_WEB_SERVICE_KEY;
      button.addEventListener("click", () => {
        AMAP_WEB_SERVICE_KEY = input.value.trim();
        if (AMAP_WEB_SERVICE_KEY) {
          localStorage.setItem(AMAP_KEY_STORAGE, AMAP_WEB_SERVICE_KEY);
          setRouteStatus("高德 Web 服务 Key 已保存到本机浏览器。现在可以点击路线按钮绘制步行/打车路线。");
          return;
        }
        localStorage.removeItem(AMAP_KEY_STORAGE);
        setRouteStatus("已清空高德 Web 服务 Key。需要绘制路线时请重新保存 Key。");
      });
    }

    function requestJsonp(url) {
      return new Promise((resolve, reject) => {
        const callbackName = `amapRoute_${Date.now()}_${Math.floor(Math.random() * 100000)}`;
        const script = document.createElement("script");
        const separator = url.includes("?") ? "&" : "?";
        let settled = false;

        window[callbackName] = data => {
          settled = true;
          cleanup();
          resolve(data);
        };

        function cleanup() {
          delete window[callbackName];
          script.remove();
        }

        script.onerror = () => {
          if (settled) return;
          cleanup();
          reject(new Error("jsonp failed"));
        };

        script.src = `${url}${separator}callback=${callbackName}`;
        document.body.appendChild(script);

        setTimeout(() => {
          if (settled) return;
          cleanup();
          reject(new Error("jsonp timeout"));
        }, 12000);
      });
    }

    async function requestJson(url) {
      const response = await fetch(url, { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function parseAmapPolyline(data) {
      const path = data && data.route && data.route.paths && data.route.paths[0];
      if (!path || !path.steps) return null;
      const coords = [];
      path.steps.forEach(step => {
        if (!step.polyline) return;
        step.polyline.split(";").forEach(point => {
          const [lng, lat] = point.split(",").map(Number);
          if (Number.isFinite(lat) && Number.isFinite(lng)) coords.push([lat, lng]);
        });
      });
      if (coords.length < 2) return null;
      return {
        coords,
        distance: Number(path.distance || 0),
        duration: Number(path.duration || 0)
      };
    }

    async function getAmapRoute(mode, from, to) {
      requireAmapAccess();
      const endpointPath = mode === "driving" ? "/v3/direction/driving" : "/v3/direction/walking";
      const endpoint = AMAP_PROXY_BASE
        ? `${AMAP_PROXY_BASE}${endpointPath}`
        : mode === "driving"
          ? "https://restapi.amap.com/v3/direction/driving"
          : "https://restapi.amap.com/v3/direction/walking";
      const params = new URLSearchParams({
        origin: `${from[1]},${from[0]}`,
        destination: `${to[1]},${to[0]}`,
        output: "json"
      });
      if (!AMAP_PROXY_BASE) params.set("key", AMAP_WEB_SERVICE_KEY);
      const data = AMAP_PROXY_BASE
        ? await requestJson(`${endpoint}?${params.toString()}`)
        : await requestJsonp(`${endpoint}?${params.toString()}`);
      if (!data || data.status !== "1") {
        throw new Error(data && data.info ? data.info : "amap route failed");
      }
      const route = parseAmapPolyline(data);
      if (!route) throw new Error("amap route empty");
      return route;
    }

    async function getOsrmRoute(mode, from, to) {
      const profile = mode === "driving" ? "driving" : "foot";
      const url = `https://router.project-osrm.org/route/v1/${profile}/${from[1]},${from[0]};${to[1]},${to[0]}?overview=full&geometries=geojson&steps=false`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("osrm route request failed");
      const data = await response.json();
      const route = data.routes && data.routes[0];
      if (!route || !route.geometry) throw new Error("osrm route not found");
      return {
        coords: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
        distance: route.distance,
        duration: route.duration
      };
    }

    function drawRoutePolyline(route, mode, sourceName) {
      L.polyline(route.coords, {
        color: mode === "driving" ? "#dc2626" : "#0f766e",
        weight: 5,
        opacity: 0.9
      }).addTo(routeLayer);
      map.fitBounds(route.coords, { padding: [60, 60], maxZoom: 15 });
      const minutes = Math.round(route.duration / 60);
      const km = (route.distance / 1000).toFixed(1);
      return `${sourceName}，约 ${km} km / ${minutes} 分钟`;
    }

    async function drawRoute(button) {
      const mode = button.dataset.mode;
      const fromName = button.dataset.fromName;
      const toName = button.dataset.toName;
      const from = [Number(button.dataset.fromLat), Number(button.dataset.fromLng)];
      const to = [Number(button.dataset.toLat), Number(button.dataset.toLng)];
      routeLayer.clearLayers();

      if (mode === "transit") {
        L.polyline([from, to], {
          color: "#2563eb",
          weight: 4,
          opacity: 0.75,
          dashArray: "6 8"
        }).addTo(routeLayer);
        map.fitBounds([from, to], { padding: [60, 60], maxZoom: 13 });
        setRouteStatus(`<strong>公交段</strong>：${fromName} -> ${toName}。本地地图先画直线参考；欧洲实时公交/换乘需要 Google Directions API 或城市交通 API，高德海外公交数据不适合这条线路。`);
        return;
      }

      const label = mode === "driving" ? "打车/驾车" : "步行";
      setRouteStatus(`<strong>${label}路线计算中</strong>：优先请求高德 Web 服务。${fromName} -> ${toName}`);

      try {
        const route = await getAmapRoute(mode, from, to);
        const summary = drawRoutePolyline(route, mode, "高德 Web 服务");
        setRouteStatus(`<strong>${label}路线</strong>：${fromName} -> ${toName}，${summary}。欧洲路网请现场再核对。`);
      } catch (amapError) {
        try {
          const route = await getOsrmRoute(mode, from, to);
          const summary = drawRoutePolyline(route, mode, "高德无可用结果，已回退 OSRM");
          setRouteStatus(`<strong>${label}路线</strong>：${fromName} -> ${toName}，${summary}。现场以实时导航为准。`);
        } catch (osrmError) {
          L.polyline([from, to], {
            color: mode === "driving" ? "#dc2626" : "#0f766e",
            weight: 4,
            opacity: 0.75,
            dashArray: "6 8"
          }).addTo(routeLayer);
          map.fitBounds([from, to], { padding: [60, 60], maxZoom: 13 });
          setRouteStatus(`<strong>${label}路线暂时无法计算</strong>：高德和 OSRM 都没有返回可用路径，已在地图中画出起终点参考线。`);
        }
      }
    }

    function pushAmapPolyline(coords, polyline) {
      if (!polyline) return;
      polyline.split(";").forEach(point => {
        const [lng, lat] = point.split(",").map(Number);
        if (Number.isFinite(lat) && Number.isFinite(lng)) coords.push([lat, lng]);
      });
    }

    function formatAmapRouteMetric(route) {
      const minutes = route.duration ? Math.round(route.duration / 60) : null;
      const km = route.distance ? (route.distance / 1000).toFixed(1) : null;
      if (km && minutes) return `${km} km / ${minutes} 分钟`;
      if (minutes) return `${minutes} 分钟`;
      if (km) return `${km} km`;
      return "时间/距离以高德返回为准";
    }

    function collectAmapPolylines(value, coords) {
      if (!value || typeof value !== "object") return;
      if (typeof value.polyline === "string") pushAmapPolyline(coords, value.polyline);
      Object.keys(value).forEach(key => {
        const child = value[key];
        if (Array.isArray(child)) child.forEach(item => collectAmapPolylines(item, coords));
        else if (child && typeof child === "object") collectAmapPolylines(child, coords);
      });
    }

    function parseAmapPathChoices(data, mode) {
      const rawPaths = data && data.route && data.route.paths;
      const paths = Array.isArray(rawPaths) ? rawPaths : rawPaths ? [rawPaths] : [];
      if (!paths || !paths.length) return [];
      return paths.map((path, index) => {
        const coords = [];
        collectAmapPolylines(path, coords);
        if (coords.length < 2) return null;
        return {
          mode,
          coords,
          summary: path.strategy || path.instruction || `方案 ${index + 1}`,
          distance: Number(path.distance || 0),
          duration: Number((path.cost && path.cost.duration) || path.duration || 0)
        };
      }).filter(Boolean);
    }

    function parseAmapTransitChoices(data) {
      const rawTransits = data && data.route && data.route.transits;
      const transits = Array.isArray(rawTransits) ? rawTransits : rawTransits ? [rawTransits] : [];
      if (!transits || !transits.length) return [];
      return transits.map((transit, index) => {
        const coords = [];
        collectAmapPolylines(transit, coords);
        if (coords.length < 2) return null;
        const lineNames = [];
        (transit.segments || []).forEach(segment => {
          (((segment.bus || {}).buslines) || []).forEach(line => {
            if (line.name) lineNames.push(line.name);
          });
        });
        return {
          mode: "transit",
          coords,
          summary: lineNames.slice(0, 3).join(" + ") || `公交方案 ${index + 1}`,
          distance: Number(transit.distance || 0),
          duration: Number((transit.cost && transit.cost.duration) || transit.duration || 0),
          cost: transit.cost && (transit.cost.transit_fee || transit.cost.taxi_fee || transit.cost.cost)
        };
      }).filter(Boolean);
    }

    function inferAmapCity(point) {
      const [lat, lng] = point;
      // AMap Web Service transit requires AMap citycode, e.g. Beijing is 010.
      // The overseas cities in this itinerary do not have public AMap citycodes
      // usable by /v5/direction/transit/integrated.
      return "";
    }

    async function getAmapRouteChoices(mode, from, to) {
      requireAmapAccess();
      if (mode === "transit") {
        const city1 = inferAmapCity(from);
        const city2 = inferAmapCity(to);
        if (!city1 || !city2) {
          throw new Error("高德 Web 服务公交接口要求 city1/city2 为高德 citycode；本行程的海外城市没有可用的高德 Web 服务 citycode。高德 App 可查海外公交，但该能力没有通过这个 Web 服务接口开放。");
        }
        const params = new URLSearchParams({
          origin: `${from[1]},${from[0]}`,
          destination: `${to[1]},${to[0]}`,
          city1,
          city2,
          strategy: "0",
          AlternativeRoute: "5",
          max_trans: "4",
          show_fields: "cost,navi",
          output: "json"
        });
        if (!AMAP_PROXY_BASE) params.set("key", AMAP_WEB_SERVICE_KEY);
        const url = AMAP_PROXY_BASE
          ? `${AMAP_PROXY_BASE}/v5/direction/transit/integrated?${params.toString()}`
          : `https://restapi.amap.com/v5/direction/transit/integrated?${params.toString()}`;
        const data = AMAP_PROXY_BASE ? await requestJson(url) : await requestJsonp(url);
        if (!data || String(data.status) !== "1") throw new Error(data && data.info ? data.info : "高德公交无结果");
        const choices = parseAmapTransitChoices(data);
        if (!choices.length) throw new Error("高德公交未返回可绘制路线");
        return choices;
      }

      const endpointPath = mode === "driving" ? "/v5/direction/driving" : "/v5/direction/walking";
      const endpoint = AMAP_PROXY_BASE
        ? `${AMAP_PROXY_BASE}${endpointPath}`
        : mode === "driving"
          ? "https://restapi.amap.com/v5/direction/driving"
          : "https://restapi.amap.com/v5/direction/walking";
      const params = new URLSearchParams({
        origin: `${from[1]},${from[0]}`,
        destination: `${to[1]},${to[0]}`,
        alternative_route: "3",
        AlternativeRoute: "3",
        show_fields: "cost,navi",
        output: "json"
      });
      if (!AMAP_PROXY_BASE) params.set("key", AMAP_WEB_SERVICE_KEY);
      const data = AMAP_PROXY_BASE
        ? await requestJson(`${endpoint}?${params.toString()}`)
        : await requestJsonp(`${endpoint}?${params.toString()}`);
      if (!data || String(data.status) !== "1") throw new Error(data && data.info ? data.info : "高德路线无结果");
      const choices = parseAmapPathChoices(data, mode);
      if (!choices.length) throw new Error("高德未返回可绘制路线");
      return choices;
    }

    function drawAmapChoice(index) {
      const route = currentRouteChoices[index];
      if (!route) return;
      routeLayer.clearLayers();
      L.polyline(route.coords, {
        color: route.mode === "driving" ? "#dc2626" : route.mode === "transit" ? "#2563eb" : "#0f766e",
        weight: 5,
        opacity: 0.9
      }).addTo(routeLayer);
      map.fitBounds(route.coords, { padding: [60, 60], maxZoom: 15 });
      document.querySelectorAll(".route-choice").forEach(button => {
        button.classList.toggle("active", Number(button.dataset.routeIndex) === index);
      });
    }

    function showAmapRouteChoices(mode, fromName, toName, choices) {
      currentRouteChoices = choices;
      const label = mode === "driving" ? "打车/驾车" : mode === "transit" ? "公交" : "步行";
      setRouteStatus(`
        <strong>${label}路线</strong>：${fromName} -> ${toName}，高德返回 ${choices.length} 条候选。请选择一条绘制到右侧地图。
        <div class="route-choice-list">
          ${choices.map((route, index) => `
            <button class="route-choice ${index === 0 ? "active" : ""}" type="button" data-route-index="${index}">
              方案 ${index + 1}：${formatAmapRouteMetric(route)}${route.cost ? ` / 约 ${route.cost} 元` : ""}<br>
              ${route.summary || "高德推荐路线"}
            </button>
          `).join("")}
        </div>
      `);
      drawAmapChoice(0);
    }

    async function drawRoute(button) {
      const mode = button.dataset.mode;
      const fromName = button.dataset.fromName;
      const toName = button.dataset.toName;
      const from = [Number(button.dataset.fromLat), Number(button.dataset.fromLng)];
      const to = [Number(button.dataset.toLat), Number(button.dataset.toLng)];
      const label = mode === "driving" ? "打车/驾车" : mode === "transit" ? "公交" : "步行";
      routeLayer.clearLayers();
      currentRouteChoices = [];
      setRouteStatus(`<strong>${label}路线计算中</strong>：正在请求高德 Web 服务。${fromName} -> ${toName}`);

      try {
        const choices = await getAmapRouteChoices(mode, from, to);
        showAmapRouteChoices(mode, fromName, toName, choices);
      } catch (error) {
        setRouteStatus(`<strong>${label}路线暂时无法计算</strong>：高德没有返回可用候选。${error.message || ""}`);
      }
    }

    document.getElementById("routeStatus").addEventListener("click", event => {
      const choice = event.target.closest(".route-choice");
      if (!choice) return;
      drawAmapChoice(Number(choice.dataset.routeIndex));
    });

    function updateActiveState() {
      document.getElementById("showAll").classList.toggle("active", !activeDayId);
      document.querySelectorAll(".day-card").forEach(card => {
        const isOpen = card.id === `card-${activeDayId}`;
        card.classList.toggle("open", isOpen);
      });
      document.querySelectorAll(".day-head").forEach(button => {
        button.classList.toggle("active", button.dataset.day === activeDayId);
      });
    }

    document.getElementById("showAll").addEventListener("click", () => {
      activeDayId = null;
      updateActiveState();
      renderMap(null);
    });

    document.getElementById("fitAll").addEventListener("click", () => renderMap(activeDayId));
    document.getElementById("openGuides").addEventListener("click", () => {
      window.location.href = "attraction-guides.html";
    });

    setupAmapKeyPanel();
    renderSidebar();
    updateActiveState();
    renderMap(activeDayId);
  </script>
</body>
</html>
